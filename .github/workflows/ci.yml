name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
      - run: cargo bench -p propaga-propagators --no-run
      - run: cargo run --example sudoku
      - run: cargo run --example n_queens
      - run: cargo run -p propaga-model --example model_sudoku
      - run: cargo run -p propaga-flatzinc --example flatzinc_solve
      - run: cargo run -p propaga-cli -- sudoku
      - run: cargo run -p propaga-cli -- n-queens --size 8
      - run: cargo run -p propaga-cli -- solve --file benchmarks/magic_square.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/cumulative.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/gcc_exact.fzn --quiet
      - run: cargo run -p propaga-cli -- schedule --file benchmarks/schedule_three_tasks.json --quiet
      - run: bash benchmarks/run.sh

  minizinc-stdlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install MiniZinc
        run: |
          sudo apt-get update
          sudo apt-get install -y minizinc
      - name: Precompile MiniZinc stdlib corpus
        run: |
          bash scripts/flatzinc-builtin-inventory.sh
          mkdir -p target/flatzinc-stdlib
          for mzn in benchmarks/minizinc/stdlib/*.mzn; do
            base=$(basename "$mzn" .mzn)
            minizinc --compile-only -o "target/flatzinc-stdlib/$base.fzn" "$mzn"
          done
      - name: Builtin corpus compile regression
        run: cargo test -p propaga-flatzinc all_stdlib_mzn_models_compile_when_fzn_present stdlib_corpus_lists_expected_models -- --nocapture

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test --workspace

  build-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p propaga-cli
      - run: cargo test -p propaga-cli
