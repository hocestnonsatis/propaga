name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
      - run: cargo bench -p propaga-propagators --no-run
      - run: cargo run --example sudoku
      - run: cargo run --example n_queens
      - run: cargo run -p propaga-model --example model_sudoku
      - run: cargo run -p propaga-flatzinc --example flatzinc_solve
      - run: cargo run -p propaga-cli -- sudoku
      - run: cargo run -p propaga-cli -- n-queens --size 8
      - run: cargo run -p propaga-cli -- solve --file benchmarks/magic_square.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/cumulative.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/gcc_exact.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/set_union.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/set_intersect.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/set_subset.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/set_eq.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/set_ne.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/set_lt.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/array_var_set_element.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/array_var_set_element_nonshifted.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/array_set_vars.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/array_set_element.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/array_float_element.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/array_bool_element.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/array_float_vars.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/array_var_bool_element.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/array_var_bool_element_nonshifted.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/array_var_int_element.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/array_var_float_element.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/set_cardinality.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/set_card_var.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/set_param.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/set_diff.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/set_symdiff.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/float_round.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/float_floor.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/float_ceil.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/seq_search_minimize.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/float_abs.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/float_min_max.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/int_min_max.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/array_float_min_max.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/array_int_min_max.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/float_exp.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/float_ln.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/float_sqrt.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/float_log2.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/float_sin.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/float_cos.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/float_times.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/float_bounds.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/float_lin_le.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/float_minimize.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/set_optimize.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/lex_less.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/all_different_only.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/generic_min.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/int_plus.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/int_times.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/int_abs.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/int_min.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/int_lin_ne.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/bool_clause.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/bool_xor.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/bool_logic.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/reified_eq.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/reified_ne.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/maximize_x.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/minimize_cost.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/regular_chain.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/automaton_chain.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/nested_predicate.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/bool_reify.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/reified_lt.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/reified_lin_eq.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/reified_lin_le.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/reified_lin_ne.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/bounded_sum.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/bounded_sum_ge.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/weighted_sum.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/weighted_sum_ge.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/count_global.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/cumulative_demand.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/disjunctive_two.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/disjunctive_three.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/disjunctive_edge.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/ordered_chain.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/strict_chain.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/permutation_sum.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/predicate_multi.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/table_puzzle.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/int_search_order.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/int_search_restart.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/lexicographic_multi.fzn --quiet
      - run: cargo run -p propaga-cli -- solve --file benchmarks/pareto_biobjective.fzn --quiet
      - run: cargo run -p propaga-cli -- schedule --file benchmarks/schedule_three_tasks.json --quiet
      - run: bash benchmarks/run.sh

  minizinc-stdlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Stdlib FlatZinc corpus regression
        run: |
          # Hand-written fixtures under benchmarks/minizinc/stdlib/*.fzn.
          # Fresh MiniZinc output is solver-specific (annotations, fzn_*,
          # array_int_lt) and is not the regression target; use local
          # scripts/flatzinc-*.sh with MiniZinc installed for that path.
          cargo test -p propaga-flatzinc --test builtin_corpus -- --nocapture

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test --workspace

  build-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p propaga-cli
      - run: cargo test -p propaga-cli
